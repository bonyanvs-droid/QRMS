<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="pageGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#011b14" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3,1.5" opacity="0.85"/>

  <!-- Quran Rehal (Stand) -->
  <g filter="url(#shadow)">
    <!-- Base Rehal wood stand -->
    <path d="M19 46 L32 37 L45 46 L42 49 L32 41 L22 49 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <path d="M22 49 L32 41 L42 49" fill="none" stroke="#713f12" stroke-width="0.8"/>
  </g>

  <!-- Open Quran Holy Book Pages -->
  <g filter="url(#shadow)">
    <!-- Left Cover & Pages -->
    <path d="M32 36 C24 33 17 33 13 36 L13 22 C17 19 24 19 32 23 Z" fill="url(#pageGradLeft)"/>
    <path d="M32 36.8 C24 33.8 17 33.8 13 36.8 L13 36 C17 33 24 33 32 36 Z" fill="#ca8a04"/>

    <!-- Right Cover & Pages -->
    <path d="M32 23 C40 19 47 19 51 22 L51 36 C47 33 40 33 32 36 Z" fill="url(#pageGradRight)"/>
    <path d="M32 36 C40 33 47 33 51 36 L51 36.8 C47 33.8 40 33.8 32 36.8 Z" fill="#ca8a04"/>

    <!-- Spine Divider -->
    <path d="M32 23 L32 37" stroke="#854d0e" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Quran Text Lines (Left Page) -->
    <line x1="17" y1="24" x2="28" y2="25.5" stroke="#854d0e" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
    <line x1="16" y1="27" x2="29" y2="28.5" stroke="#854d0e" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
    <line x1="17" y1="30" x2="28" y2="31.5" stroke="#854d0e" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>

    <!-- Quran Text Lines (Right Page) -->
    <line x1="36" y1="25.5" x2="47" y2="24" stroke="#854d0e" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
    <line x1="35" y1="28.5" x2="48" y2="27" stroke="#854d0e" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
    <line x1="36" y1="31.5" x2="47" y2="30" stroke="#854d0e" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Islamic Star & Noor Top Accent -->
  <g transform="translate(32, 13) scale(0.9)">
    <!-- 8-point Islamic Star -->
    <path d="M0 -4.5 L1.3 -1.3 L4.5 0 L1.3 1.3 L0 4.5 L-1.3 1.3 L-4.5 0 L-1.3 -1.3 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="1" fill="#ffffff"/>
  </g>
</svg>
